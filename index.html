<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taskline</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Taskline</h1>
        <p class="tagline">A calm, fast task list for small teams.</p>
      </header>
      <form id="new-task">
        <input id="title" placeholder="What needs doing?" autocomplete="off" required />
        <input id="due" type="date" aria-label="Due date" />
        <button type="submit">Add</button>
      </form>
      <ul id="tasks"></ul>
    </main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
